backend:
  name: github
  repo: Ncy25/Nancy-site
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "site"
    label: "Réglages du site"
    files:
      - name: "site"
        label: "Logo & informations générales"
        file: "content/site.json"
        fields:
          - { label: "Logo (image)", name: "logo_image", widget: "image", required: false, hint: "Laisser vide pour garder le logo texte actuel." }
          - { label: "Nom de la marque", name: "brand_name", widget: "string" }
          - { label: "Email de contact", name: "contact_email", widget: "string" }
          - { label: "Logo texte — 1ère ligne (script, ex: Wild)", name: "footer_logo_script", widget: "string" }
          - { label: "Logo texte — 2ème ligne (ex: Flower · by Wooden Mountain)", name: "footer_logo_line", widget: "string" }

  - name: "home"
    label: "Page d'accueil"
    files:
      - name: "home"
        label: "Textes de la page d'accueil"
        file: "content/home.json"
        fields:
          - { label: "Bandeau promo (haut de page)", name: "promo_bar", widget: "string" }
          - label: "Hero (grand titre d'accueil)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petite phrase manuscrite", name: "script", widget: "string" }
              - { label: "Titre — ligne 1", name: "title_line1", widget: "string" }
              - { label: "Titre — ligne 2", name: "title_line2", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - { label: "Texte du bouton", name: "button_text", widget: "string" }
              - { label: "Photo principale (grande vignette)", name: "main_image", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
              - { label: "Petite photo 1", name: "small_image_1", widget: "image", required: false }
              - { label: "Petite photo 2", name: "small_image_2", widget: "image", required: false }
              - { label: "Petite photo 3", name: "small_image_3", widget: "image", required: false }
          - { label: "Titre section 'lifestyle'", name: "lifestyle_title", widget: "string" }
          - { label: "Titre section boutique", name: "boutique_title", widget: "string" }
          - { label: "Sous-titre section boutique", name: "boutique_subtitle", widget: "string" }
          - label: "Notre histoire"
            name: "histoire"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Paragraphe 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraphe 2", name: "paragraph2", widget: "text" }
              - { label: "Badges (liste)", name: "chips", widget: "list" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Titre intro", name: "intro_title", widget: "string" }
              - { label: "Texte intro", name: "intro_text", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Note expédition", name: "shipping_note", widget: "string" }
              - { label: "Note sur-mesure", name: "custom_note", widget: "string" }
              - { label: "Citation", name: "quote", widget: "text" }
          - { label: "Tagline du pied de page", name: "footer_tagline", widget: "text" }
          - { label: "Copyright pied de page", name: "footer_copyright", widget: "string" }

  - name: "products"
    label: "Produits — Boutique"
    files:
      - name: "products"
        label: "Liste des produits (boutique)"
        file: "content/products.json"
        fields:
          - name: "products"
            label: "Produits"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}} ({{fields.price}}€)"
            fields:
              - { label: "Identifiant (unique, sans espace)", name: "id", widget: "string" }
              - { label: "Nom", name: "name", widget: "string" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Pampilles + Créoles", "Pampilles", "Créoles", "Exclusivités"]
                hint: "Coche la catégorie de ce produit. Un bouton de filtre apparaît automatiquement sur la boutique pour chaque catégorie utilisée par au moins un produit."
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float" }
              - label: "Motif ou uni ?"
                name: "variant"
                widget: "select"
                options: [{ label: "Uni", value: "uni" }, { label: "Motifs", value: "motifs" }]
                default: "uni"
                hint: "Utilisé par les filtres 'Unies' / 'Motifs' de la boutique."
              - { label: "Emoji (utilisé si pas de photo)", name: "emoji", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Couleurs disponibles (codes hex)", name: "colors", widget: "list" }
              - { label: "Couleur de fond de la vignette", name: "bg", widget: "color" }
              - label: "Badge"
                name: "badge"
                widget: "select"
                options: ["", "new", "bestseller"]
                required: false
              - label: "Stock"
                name: "stock"
                widget: "select"
                options: ["in_stock", "low"]
              - { label: "Photo du produit", name: "image", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }

  - name: "nouveautes"
    label: "Nouveautés"
    files:
      - name: "nouveautes"
        label: "Page Nouveautés"
        file: "content/nouveautes.json"
        fields:
          - { label: "Phrase (haut de page)", name: "hero_eyebrow", widget: "string" }
          - { label: "Titre — ligne 1", name: "hero_title_line1", widget: "string" }
          - { label: "Titre — ligne 2", name: "hero_title_line2", widget: "string" }
          - { label: "Sous-titre du hero", name: "hero_subtitle", widget: "text" }
          - { label: "Badge 1", name: "hero_tag1", widget: "string" }
          - { label: "Badge 2", name: "hero_tag2", widget: "string" }
          - { label: "Badge 3", name: "hero_tag3", widget: "string" }
          - { label: "Étiquette section produits", name: "section_label", widget: "string" }
          - { label: "Titre section produits", name: "section_title", widget: "string" }
          - { label: "Photo mosaïque 1 (badge Nouveau)", name: "mosaic_image_1", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
          - { label: "Photo mosaïque 2 (badge Exclusif)", name: "mosaic_image_2", widget: "image", required: false }
          - { label: "Photo mosaïque 3 (badge Saison)", name: "mosaic_image_3", widget: "image", required: false }
          - { label: "Photo mosaïque 4", name: "mosaic_image_4", widget: "image", required: false }
          - { label: "Titre du compte à rebours", name: "countdown_title", widget: "string" }
          - { label: "Sous-titre du compte à rebours", name: "countdown_subtitle", widget: "text" }
          - label: "Produit vedette (grande bannière)"
            name: "feature"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "tag", widget: "string" }
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
          - name: "products"
            label: "Produits nouveautés"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}} ({{fields.price}}€)"
            fields:
              - { label: "Identifiant (unique, sans espace)", name: "id", widget: "string" }
              - { label: "Nom", name: "name", widget: "string" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Pampilles + Créoles", "Pampilles", "Créoles", "Exclusivités"]
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float" }
              - { label: "Emoji (utilisé si pas de photo)", name: "emoji", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Couleurs disponibles (codes hex)", name: "colors", widget: "list" }
              - { label: "Couleur de fond de la vignette", name: "bg", widget: "color" }
              - label: "Badge"
                name: "badge"
                widget: "select"
                options: ["", "new", "exclu"]
                required: false
              - label: "Stock"
                name: "stock"
                widget: "select"
                options: ["in_stock", "low"]
              - { label: "Photo du produit", name: "image", widget: "image", required: false }

  - name: "cgv"
    label: "CGV"
    files:
      - name: "cgv"
        label: "Conditions Générales de Vente"
        file: "content/cgv.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string" }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Numéro d'article (ex: Article 1)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "mentions-legales"
    label: "Mentions légales"
    files:
      - name: "mentions-legales"
        label: "Mentions légales"
        file: "content/mentions-legales.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string" }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Numéro d'article (ex: Article 1)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "confidentialite"
    label: "Confidentialité"
    files:
      - name: "confidentialite"
        label: "Politique de Confidentialité"
        file: "content/confidentialite.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string" }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Numéro d'article (ex: Article 1)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "histoire-photos"
    label: "Photos — Notre histoire"
    files:
      - name: "histoire"
        label: "Photos de la page Notre histoire"
        file: "content/histoire.json"
        fields:
          - { label: "Bloc 1 — photo 1 (haut gauche)", name: "block1_image_1", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
          - { label: "Bloc 1 — photo 2 (haut droite)", name: "block1_image_2", widget: "image", required: false }
          - { label: "Bloc 1 — photo 3 (bas gauche)", name: "block1_image_3", widget: "image", required: false }
          - { label: "Bloc 1 — photo 4 (bas droite)", name: "block1_image_4", widget: "image", required: false }
          - { label: "Bloc 2 — 'L'argile polymère' (grande photo)", name: "block2_image", widget: "image", required: false }
          - { label: "Bloc 3 — 'Changer d'humeur' (grande photo)", name: "block3_image", widget: "image", required: false }
          - { label: "Matériaux — photo 1", name: "materials_image_1", widget: "image", required: false }
          - { label: "Matériaux — photo 2", name: "materials_image_2", widget: "image", required: false }
          - { label: "Matériaux — photo 3", name: "materials_image_3", widget: "image", required: false }
          - { label: "Matériaux — photo 4", name: "materials_image_4", widget: "image", required: false }

  - name: "livraisons"
    label: "Livraisons & Retours"
    files:
      - name: "livraisons"
        label: "Livraisons & Retours"
        file: "content/livraisons.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string", required: false }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Étiquette (ex: Préparation)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "histoire-textes"
    label: "Textes — Notre histoire"
    files:
      - name: "histoire-textes"
        label: "Textes de la page Notre histoire"
        file: "content/histoire-texts.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petite phrase (ex: Depuis 2023)", name: "eyebrow", widget: "string" }
              - { label: "Titre — ligne 1", name: "title_line1", widget: "string" }
              - { label: "Titre — ligne 2", name: "title_line2", widget: "string" }
              - { label: "Texte d'intro", name: "lead", widget: "text" }
              - { label: "Citation", name: "quote_text", widget: "text" }
              - { label: "Auteur de la citation", name: "quote_author", widget: "string" }
              - { label: "Statistique 1 — chiffre", name: "stat1_num", widget: "string" }
              - { label: "Statistique 1 — légende", name: "stat1_label", widget: "string" }
              - { label: "Statistique 2 — chiffre", name: "stat2_num", widget: "string" }
              - { label: "Statistique 2 — légende", name: "stat2_label", widget: "string" }
              - { label: "Statistique 3 — chiffre", name: "stat3_num", widget: "string" }
              - { label: "Statistique 3 — légende", name: "stat3_label", widget: "string" }
          - name: "values"
            label: "Bande des 4 valeurs"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Émoji", name: "icon", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Bloc 1 — Le commencement"
            name: "block1"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Phrase d'intro", name: "eyebrow", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Paragraphe 1", name: "p1", widget: "text" }
              - { label: "Paragraphe 2", name: "p2", widget: "text" }
              - { label: "Paragraphe 3", name: "p3", widget: "text" }
              - { label: "Badge flottant — émoji", name: "float_icon", widget: "string" }
              - { label: "Badge flottant — texte", name: "float_text", widget: "string" }
          - label: "Bloc 2 — La matière"
            name: "block2"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Phrase d'intro", name: "eyebrow", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Paragraphe 1", name: "p1", widget: "text" }
              - { label: "Paragraphe 2", name: "p2", widget: "text" }
              - { label: "Paragraphe 3", name: "p3", widget: "text" }
              - { label: "Badge flottant — émoji", name: "float_icon", widget: "string" }
              - { label: "Badge flottant — texte", name: "float_text", widget: "string" }
          - label: "Bloc 3 — L'innovation"
            name: "block3"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Phrase d'intro", name: "eyebrow", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Paragraphe 1", name: "p1", widget: "text" }
              - { label: "Paragraphe 2", name: "p2", widget: "text" }
              - { label: "Paragraphe 3", name: "p3", widget: "text" }
              - { label: "Badge flottant — émoji", name: "float_icon", widget: "string" }
              - { label: "Badge flottant — texte", name: "float_text", widget: "string" }
          - label: "Matériaux"
            name: "materials"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Paragraphe 1", name: "p1", widget: "text" }
              - { label: "Paragraphe 2", name: "p2", widget: "text" }
              - { label: "Paragraphe 3", name: "p3", widget: "text" }
              - { label: "Badge 1", name: "chip1", widget: "string" }
              - { label: "Badge 2", name: "chip2", widget: "string" }
              - { label: "Badge 3", name: "chip3", widget: "string" }
              - { label: "Badge 4", name: "chip4", widget: "string" }
              - { label: "Badge 5", name: "chip5", widget: "string" }
              - { label: "Badge 6", name: "chip6", widget: "string" }

  - name: "histoire-suite"
    label: "Chronologie & Témoignages"
    files:
      - name: "histoire-suite"
        label: "Chronologie, engagements, témoignages, CTA"
        file: "content/histoire-suite.json"
        fields:
          - label: "Chronologie de fabrication"
            name: "timeline"
            widget: "object"
            fields:
              - { label: "Étiquette de section", name: "label", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - name: "steps"
                label: "Étapes"
                widget: "list"
                summary: "{{fields.step}} — {{fields.title}}"
                fields:
                  - { label: "Émoji", name: "dot", widget: "string" }
                  - { label: "Numéro (ex: Étape 1)", name: "step", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
          - label: "Engagements"
            name: "engagement"
            widget: "object"
            fields:
              - { label: "Étiquette de section", name: "label", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - name: "cards"
                label: "Cartes"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Émoji", name: "icon", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
          - label: "Témoignages"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Étiquette de section", name: "label", widget: "string" }
              - { label: "Titre de section", name: "title", widget: "string" }
              - name: "reviews"
                label: "Avis"
                widget: "list"
                summary: "{{fields.author}}"
                fields:
                  - { label: "Texte de l'avis", name: "text", widget: "text" }
                  - { label: "Prénom", name: "author", widget: "string" }
                  - { label: "Ville", name: "location", widget: "string" }
          - label: "Bandeau final (CTA)"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Petite phrase", name: "script", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
