backend:
  name: github
  repo: Ncy25/Nancy-site
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "site"
    label: "Réglages du site"
    files:
      - name: "site"
        label: "Logo & informations générales"
        file: "content/site.json"
        fields:
          - { label: "Logo (image)", name: "logo_image", widget: "image", required: false, hint: "Laisser vide pour garder le logo texte actuel." }
          - { label: "Nom de la marque", name: "brand_name", widget: "string" }
          - { label: "Email de contact", name: "contact_email", widget: "string" }
          - { label: "Logo texte — 1ère ligne (script, ex: Wild)", name: "footer_logo_script", widget: "string" }
          - { label: "Logo texte — 2ème ligne (ex: Flower · by Wooden Mountain)", name: "footer_logo_line", widget: "string" }
          - { label: "Point retrait — Activer", name: "pickup_enabled", widget: "boolean", default: true, required: false, hint: "Active ou désactive l'option de retrait gratuit à la page de paiement." }
          - { label: "Point retrait — Adresse", name: "pickup_address", widget: "text", required: false, hint: "Ex: 12 rue des Fleurs, 75000 Paris — sur rendez-vous. Laisser vide pour retirer l'option du paiement." }

  - name: "home"
    label: "Page d'accueil"
    files:
      - name: "home"
        label: "Textes de la page d'accueil"
        file: "content/home.json"
        fields:
          - { label: "Bandeau promo (haut de page)", name: "promo_bar", widget: "string" }
          - label: "Hero (grand titre d'accueil)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petite phrase manuscrite", name: "script", widget: "string" }
              - { label: "Titre principal", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - { label: "Texte du bouton", name: "button_text", widget: "string" }
              - { label: "Lien du bouton", name: "button_link", widget: "string", required: false, hint: "Ex : nouveautes.html ou boutique.html" }
              - { label: "Photo principale (à droite du texte)", name: "photo", widget: "image", required: false, hint: "Photo de style lifestyle, format portrait recommandé." }
              - label: "3 étapes (sous le hero)"
                name: "steps"
                widget: "list"
                required: false
                min: 3
                max: 3
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre (ex : 1. La base)", name: "title", widget: "string", required: false }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Photo", name: "image", widget: "image", required: false }
          - { label: "Titre section 'lifestyle'", name: "lifestyle_title", widget: "string" }
          - label: "Bandeau Wooden Mountain"
            name: "wm_banner"
            widget: "object"
            required: false
            fields:
              - { label: "Petite phrase (ex : L'univers)", name: "eyebrow", widget: "string", required: false }
              - { label: "Titre (ex : Wooden Mountain)", name: "title", widget: "string", required: false }
              - { label: "Sous-titre", name: "subtitle", widget: "text", required: false }
              - { label: "Texte du bouton (ex : Découvrir)", name: "button_text", widget: "string", required: false }
          - { label: "Titre section boutique", name: "boutique_title", widget: "string" }
          - { label: "Sous-titre section boutique", name: "boutique_subtitle", widget: "string" }
          - { label: "Texte sous les produits (avant les 3 rectangles)", name: "below_products_text", widget: "string", required: false }
          - label: "Notre histoire"
            name: "histoire"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Paragraphe 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraphe 2", name: "paragraph2", widget: "text" }
              - { label: "Badges (liste)", name: "chips", widget: "list" }
              - { label: "Photo 1 (cœur)", name: "about_img1", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
              - { label: "Photo 2 (fleur)", name: "about_img2", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
              - { label: "Photo 3 (anneau)", name: "about_img3", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
              - { label: "Photo 4 (feuille)", name: "about_img4", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Étiquette", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Titre intro", name: "intro_title", widget: "string" }
              - { label: "Texte intro", name: "intro_text", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Note expédition", name: "shipping_note", widget: "string" }
              - { label: "Note sur-mesure", name: "custom_note", widget: "string" }
              - { label: "Citation", name: "quote", widget: "text" }
          - { label: "Tagline du pied de page", name: "footer_tagline", widget: "text" }
          - { label: "Copyright pied de page", name: "footer_copyright", widget: "string" }

  - name: "products"
    label: "Produits — Boutique"
    files:
      - name: "products"
        label: "Liste des produits (boutique)"
        file: "content/products.json"
        fields:
          - { label: "Phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Étiquette section produits", name: "section_label", widget: "string" }
          - { label: "Titre section produits", name: "section_title", widget: "string" }
          - { label: "Titre section \"Choisis tes créoles\"", name: "creoles_title", widget: "string" }
          - { label: "Titre section \"Choisis tes pampilles\"", name: "pampilles_title", widget: "string" }
          - { label: "Titre section \"Les Bracelets\"", name: "bracelets_title", widget: "string", required: false }
          - { label: "Titre section \"Les Colliers\"", name: "colliers_title", widget: "string", required: false }
          - { label: "Bouton pampilles — Tout voir", name: "pampilles_tab_all", widget: "string" }
          - { label: "Bouton pampilles — Unies", name: "pampilles_tab_uni", widget: "string" }
          - { label: "Bouton pampilles — Motifs", name: "pampilles_tab_motifs", widget: "string" }
          - name: "products"
            label: "Produits"
            widget: "list"
            required: false
            summary: "{{fields.name}} — {{fields.category}} ({{fields.price}}€)"
            fields:
              - { label: "Identifiant (unique, sans espace)", name: "id", widget: "string", required: false }
              - { label: "Nom", name: "name", widget: "string", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: [{ label: "(Aucune)", value: "" }, { label: "Pampilles", value: "Pampilles" }, { label: "Créoles", value: "Créoles" }, { label: "Bracelets", value: "Bracelets" }, { label: "Colliers", value: "Colliers" }]
                required: false
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float", required: false }
              - label: "Motif ou uni ?"
                name: "variant"
                widget: "select"
                options: [{ label: "Uni", value: "uni" }, { label: "Motifs", value: "motifs" }]
                default: "uni"
                hint: "Utilisé par les filtres 'Unies' / 'Motifs' de la boutique."
                required: false
              - { label: "Emoji (utilisé si pas de photo)", name: "emoji", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Couleurs disponibles (codes hex)", name: "colors", widget: "list", required: false }
              - { label: "Couleur de fond de la vignette", name: "bg", widget: "color", required: false }
              - label: "Badge"
                name: "badge"
                widget: "select"
                options: [{ label: "Aucun", value: "" }, { label: "Nouveau", value: "new" }, { label: "Bestseller", value: "bestseller" }, { label: "Exclu", value: "exclu" }]
                required: false
              - label: "Stock"
                name: "stock"
                widget: "select"
                options: ["in_stock", "low"]
                required: false
              - { label: "Photo du produit", name: "image", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
              - { label: "Poids (grammes)", name: "weight", widget: "number", value_type: "int", required: false, hint: "Utilisé pour déterminer si Lettre suivie (max 20g) reste proposée au client." }
              - { label: "Afficher sur la page d'accueil", name: "show_on_home", widget: "boolean", default: false, required: false, hint: "Maximum 10 produits affichés sur l'accueil. Si aucun n'est coché, les 10 premiers s'affichent par défaut." }
              - { label: "Afficher aussi sur la page Nouveautés", name: "show_on_nouveautes", widget: "boolean", default: false, required: false, hint: "Évite de publier deux fois la même annonce : coche pour que ce produit apparaisse aussi sur Nouveautés, en plus de la boutique." }

  - name: "nouveautes"
    label: "Nouveautés"
    files:
      - name: "nouveautes"
        label: "Page Nouveautés"
        file: "content/nouveautes.json"
        fields:
          - { label: "Phrase (haut de page)", name: "hero_eyebrow", widget: "string", required: false }
          - { label: "Titre — ligne 1", name: "hero_title_line1", widget: "string", required: false }
          - { label: "Titre — ligne 2", name: "hero_title_line2", widget: "string", required: false }
          - { label: "Sous-titre du hero", name: "hero_subtitle", widget: "text", required: false }
          - { label: "Badge 1", name: "hero_tag1", widget: "string", required: false }
          - { label: "Badge 2", name: "hero_tag2", widget: "string", required: false }
          - { label: "Badge 3", name: "hero_tag3", widget: "string", required: false }
          - { label: "Étiquette section produits", name: "section_label", widget: "string", required: false }
          - { label: "Titre section produits", name: "section_title", widget: "string", required: false }
          - { label: "Photo mosaïque 1 (badge Nouveau)", name: "mosaic_image_1", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
          - { label: "Photo mosaïque 2 (badge Exclusif)", name: "mosaic_image_2", widget: "image", required: false }
          - { label: "Photo mosaïque 3 (badge Saison)", name: "mosaic_image_3", widget: "image", required: false }
          - { label: "Photo mosaïque 4", name: "mosaic_image_4", widget: "image", required: false }
          - { label: "Titre du compte à rebours", name: "countdown_title", widget: "string", required: false }
          - { label: "Sous-titre du compte à rebours", name: "countdown_subtitle", widget: "text", required: false }
          - { label: "Date et heure de fin du compte à rebours", name: "countdown_end", widget: "datetime", required: false, hint: "Le compte à rebours affichera le temps restant jusqu'à cette date précise." }
          - name: "products"
            label: "Produits nouveautés"
            widget: "list"
            required: false
            summary: "{{fields.name}} — {{fields.category}} ({{fields.price}}€)"
            fields:
              - { label: "Identifiant (unique, sans espace)", name: "id", widget: "string", required: false }
              - { label: "Nom", name: "name", widget: "string", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: [{ label: "(Aucune)", value: "" }, { label: "Pampilles", value: "Pampilles" }, { label: "Créoles", value: "Créoles" }]
                required: false
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float", required: false }
              - { label: "Emoji (utilisé si pas de photo)", name: "emoji", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Couleurs disponibles (codes hex)", name: "colors", widget: "list", required: false }
              - { label: "Couleur de fond de la vignette", name: "bg", widget: "color", required: false }
              - label: "Badge"
                name: "badge"
                widget: "select"
                options: ["", "new", "exclu"]
                required: false
              - label: "Stock"
                name: "stock"
                widget: "select"
                options: ["in_stock", "low"]
                required: false
              - { label: "Photo du produit", name: "image", widget: "image", required: false }
              - { label: "Poids (grammes)", name: "weight", widget: "number", value_type: "int", required: false, hint: "Utilisé pour déterminer si Lettre suivie (max 20g) reste proposée au client." }
          - label: "Aperçu de la prochaine collection"
            name: "sneak"
            widget: "object"
            required: false
            fields:
              - { label: "Petite phrase", name: "script", widget: "string", required: false }
              - { label: "Titre de la section", name: "title", widget: "string", required: false }
              - name: "cards"
                label: "Cartes (aperçu flouté)"
                widget: "list"
                summary: "{{fields.name}}"
                max: 4
                required: false
                fields:
                  - { label: "Nom (mystère)", name: "name", widget: "string", required: false }
                  - { label: "Date / période annoncée", name: "date", widget: "string", required: false }
                  - { label: "Couleur de fond", name: "bg", widget: "color", required: false }
                  - { label: "Couleur d'accent (le rond flouté)", name: "accent", widget: "color", required: false }

  - name: "wooden-mountain"
    label: "Wooden Mountain"
    files:
      - name: "wooden-mountain"
        label: "Page Wooden Mountain"
        file: "content/wooden-mountain.json"
        fields:
          - { label: "Phrase (haut de page)", name: "hero_eyebrow", widget: "string", required: false }
          - { label: "Titre — ligne 1", name: "hero_title_line1", widget: "string", required: false }
          - { label: "Titre — ligne 2", name: "hero_title_line2", widget: "string", required: false }
          - { label: "Sous-titre du hero", name: "hero_subtitle", widget: "text", required: false }
          - { label: "Badge 1", name: "hero_tag1", widget: "string", required: false }
          - { label: "Badge 2", name: "hero_tag2", widget: "string", required: false }
          - { label: "Badge 3", name: "hero_tag3", widget: "string", required: false }
          - { label: "Étiquette section produits", name: "section_label", widget: "string", required: false }
          - { label: "Titre section produits", name: "section_title", widget: "string", required: false }
          - { label: "Photo mosaïque 1", name: "mosaic_image_1", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
          - { label: "Photo mosaïque 2", name: "mosaic_image_2", widget: "image", required: false }
          - { label: "Photo mosaïque 3", name: "mosaic_image_3", widget: "image", required: false }
          - { label: "Photo mosaïque 4", name: "mosaic_image_4", widget: "image", required: false }
          - label: "Bandeau final (Une question ?)"
            name: "cta"
            widget: "object"
            required: false
            fields:
              - { label: "Petite phrase", name: "script", widget: "string", required: false }
              - { label: "Titre", name: "title", widget: "string", required: false }
              - { label: "Sous-titre", name: "subtitle", widget: "text", required: false }
          - name: "products"
            label: "Produits Wooden Mountain"
            widget: "list"
            required: false
            summary: "{{fields.name}} — {{fields.category}} ({{fields.price}}€)"
            fields:
              - { label: "Identifiant (unique, sans espace)", name: "id", widget: "string", required: false }
              - { label: "Nom", name: "name", widget: "string", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: [{ label: "(Aucune)", value: "" }, { label: "Bois", value: "Bois" }, { label: "Plexiglass", value: "Plexiglass" }]
                required: false
                hint: "Information sur la matière (n'affecte plus les filtres de la page)."
              - label: "Occasion"
                name: "occasion"
                widget: "select"
                options: [{ label: "(Aucune)", value: "" }, { label: "Cave&Bar", value: "Cave&Bar" }, { label: "Noël", value: "Noël" }, { label: "Déco murale", value: "Déco murale" }, { label: "Pâques", value: "Pâques" }, { label: "Naissance", value: "Naissance" }, { label: "Mariage", value: "Mariage" }, { label: "Ecole", value: "Ecole" }]
                required: false
                hint: "Détermine dans quel filtre ce produit apparaît sur la page."
              - { label: "Prix (€)", name: "price", widget: "number", value_type: "float", required: false }
              - { label: "Emoji (utilisé si pas de photo)", name: "emoji", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Couleurs disponibles (codes hex)", name: "colors", widget: "list", required: false }
              - { label: "Couleur de fond de la vignette", name: "bg", widget: "color", required: false }
              - label: "Badge"
                name: "badge"
                widget: "select"
                options: ["", "new", "exclu"]
                required: false
              - label: "Stock"
                name: "stock"
                widget: "select"
                options: ["in_stock", "low"]
                required: false
              - { label: "Photo du produit", name: "image", widget: "image", required: false }
              - { label: "Poids (grammes)", name: "weight", widget: "number", value_type: "int", required: false, hint: "Utilisé pour déterminer si Lettre suivie (max 20g) reste proposée au client." }
              - { label: "Demande une gravure personnalisée au client", name: "custom_gravure", widget: "boolean", default: false, required: false, hint: "Si activé, un champ texte obligatoire s'affiche sur la fiche produit pour que le client précise le prénom/mot à graver." }
              - { label: "Demande Date, Heure, Poids et Taille au client", name: "custom_finition", widget: "boolean", default: false, required: false, hint: "Si activé, un champ texte obligatoire s'affiche sur la fiche produit pour que le client précise ces informations." }
              - { label: "Demande de choisir 3 couleurs au client", name: "custom_colors3", widget: "boolean", default: false, required: false, hint: "Si activé, un champ texte obligatoire s'affiche sur la fiche produit pour que le client précise ses 3 couleurs." }

  - name: "cgv"
    label: "CGV"
    files:
      - name: "cgv"
        label: "Conditions Générales de Vente"
        file: "content/cgv.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string" }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Numéro d'article (ex: Article 1)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "mentions-legales"
    label: "Mentions légales"
    files:
      - name: "mentions-legales"
        label: "Mentions légales"
        file: "content/mentions-legales.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string" }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Numéro d'article (ex: Article 1)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "confidentialite"
    label: "Confidentialité"
    files:
      - name: "confidentialite"
        label: "Politique de Confidentialité"
        file: "content/confidentialite.json"
        fields:
          - { label: "Petite phrase (haut de page)", name: "header_script", widget: "string" }
          - { label: "Titre de la page", name: "header_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "header_subtitle", widget: "string" }
          - { label: "Texte 'Mis à jour le...'", name: "updated_label", widget: "string" }
          - name: "sections"
            label: "Articles"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Émoji (sommaire)", name: "toc_emoji", widget: "string" }
              - { label: "Libellé court (sommaire)", name: "toc_label", widget: "string" }
              - { label: "Numéro d'article (ex: Article 1)", name: "tag", widget: "string" }
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Texte de l'article"
                name: "body"
                widget: "text"
                hint: "Sépare les paragraphes par une ligne vide. Pour une liste à puces, commence chaque ligne par '- '. Pour un encadré coloré, commence le paragraphe par '[ENCADRÉ] '."

  - name: "histoire-photos"
    label: "Photos — Notre histoire"
    files:
      - name: "histoire"
        label: "Photos de la page Notre histoire"
        file: "content/histoire.json"
        fields:
          - { label: "Bloc 1 — photo 1 (haut gauche)", name: "block1_image_1", widget: "image", required: false, hint: "Laisser vide pour garder l'illustration actuelle." }
          - { label: "Bloc 1 — photo 2 (haut droite)", name: "block1_image_2", widget: "image", required: false }
          - { label: "Bloc 1 — photo 3 (bas gauche)", name: "block1_image_3", widget: "image", required: false }
          - { label: "Bloc 1 — photo 4 (bas droite)", name: "block1_image_4", widget: "image", required: false }
          - { label: "Bloc 2 — 'L'argile polymère' (grande photo)", name: "block2_image", widget: "image", required: false }
          - { label: "Bloc 3 — 'Changer d'humeur' (grande photo)", name: "block3_image", widget: "image", required: false }
