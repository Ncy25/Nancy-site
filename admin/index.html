<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Administration — Wild Flower by Wooden Mountain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

  <script type="module">
    /* ── Attendre que l'objet CMS soit disponible ── */
    function whenCmsReady(cb) {
      if (window.CMS) { cb(window.CMS); return; }
      let tries = 0;
      const t = setInterval(() => {
        tries++;
        if (window.CMS) { clearInterval(t); cb(window.CMS); }
        else if (tries > 100) { clearInterval(t); }
      }, 50);
    }

    whenCmsReady(function (CMS) {

      /* ── STYLE GLOBAL DE L'APERÇU (reprend les couleurs et polices du site) ── */
      CMS.registerPreviewStyle(`
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@600;700&display=swap');
        :root {
          --blush: #F9E8E0; --blush-mid: #F5D5C8; --peach: #F0A882; --peach-dk: #D97A52;
          --terra: #C26B4A; --rose: #F2BFB5; --rose-lt: #FDEAE5; --cream: #FFF8F5;
          --ivory: #FFFCFA; --gold: #D4A853; --sage: #8FAF8A; --sage-lt: #C4D9BE;
          --brown: #6B3D2A; --brown-mid: #8B5540; --gray: #9E8880;
          --font-d: 'Cormorant Garamond', Georgia, serif;
          --font-s: 'Dancing Script', cursive;
          --font-b: 'DM Sans', sans-serif;
        }
        body { font-family: var(--font-b); background: var(--ivory); color: var(--brown); margin: 0; padding: 24px; }
        .wf-promo { background: var(--peach); color: #fff; text-align: center; padding: 8px 14px; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; border-radius: 8px; margin-bottom: 20px; }
        .wf-hero { background: linear-gradient(135deg, #FDE8DC 0%, #FAD0B4 60%, #F5C0A0 100%); border-radius: 20px; padding: 36px 28px; text-align: center; margin-bottom: 24px; }
        .wf-script { font-family: var(--font-s); font-size: 18px; color: var(--brown); margin-bottom: 4px; }
        .wf-h1 { font-family: var(--font-d); font-size: 40px; font-weight: 600; line-height: 1; color: #fff; text-shadow: 0 2px 10px rgba(195,107,74,0.25); margin: 4px 0 12px; }
        .wf-sub { font-size: 13.5px; color: rgba(255,255,255,0.92); max-width: 380px; margin: 0 auto 16px; line-height: 1.6; }
        .wf-btn { display: inline-block; padding: 9px 22px; background: #fff; color: var(--peach-dk); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; }
        .wf-section-title { font-family: var(--font-d); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--peach-dk); text-align: center; margin-bottom: 4px; }
        .wf-section-h2 { font-family: var(--font-s); font-size: 26px; color: var(--brown-mid); text-align: center; margin-bottom: 18px; }
        .wf-block { background: var(--blush); border-radius: 16px; padding: 22px 24px; margin-bottom: 18px; }
        .wf-block h3 { font-family: var(--font-d); font-size: 20px; font-weight: 600; color: var(--brown); margin: 0 0 10px; }
        .wf-block p { font-size: 13.5px; color: var(--brown-mid); line-height: 1.7; margin: 0 0 8px; }
        .wf-chip { display: inline-block; background: rgba(255,255,255,0.7); color: var(--brown-mid); font-size: 11.5px; font-weight: 500; padding: 5px 12px; border-radius: 999px; margin: 3px 4px 0 0; }
        .wf-quote { font-family: var(--font-d); font-style: italic; font-size: 15px; color: var(--brown); border-left: 3px solid var(--peach); padding-left: 14px; margin: 10px 0; }
        .wf-footer { background: var(--brown); color: rgba(255,248,245,0.75); border-radius: 16px; padding: 20px 24px; text-align: center; }
        .wf-footer p { font-size: 12px; margin: 4px 0; }
        .wf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
        .wf-card { background: var(--ivory); border: 1px solid rgba(242,191,181,0.4); border-radius: 14px; overflow: hidden; }
        .wf-card-img { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .wf-card-badge { position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; padding: 3px 8px; border-radius: 999px; }
        .wf-card-badge.new { background: var(--peach); }
        .wf-card-badge.bestseller, .wf-card-badge.exclu { background: var(--gold); }
        .wf-card-body { padding: 10px 12px; }
        .wf-card-cat { font-size: 9.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--peach-dk); }
        .wf-card-name { font-family: var(--font-d); font-size: 16px; font-weight: 600; color: var(--brown); margin: 2px 0; }
        .wf-card-desc { font-size: 11px; color: var(--gray); line-height: 1.4; margin-bottom: 6px; }
        .wf-card-price { font-family: var(--font-d); font-size: 15px; font-weight: 600; color: var(--brown-mid); }
        .wf-colors { display: flex; gap: 4px; margin-top: 6px; }
        .wf-color-dot { width: 12px; height: 12px; border-radius: 50%; }
        .wf-feature { background: linear-gradient(135deg, var(--peach-dk), var(--terra)); border-radius: 18px; padding: 24px; color: #fff; margin-bottom: 18px; }
        .wf-feature-tag { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
        .wf-feature h2 { font-family: var(--font-d); font-size: 24px; margin: 6px 0 8px; }
        .wf-feature p { font-size: 12.5px; opacity: .85; line-height: 1.6; max-width: 340px; }
        .wf-logo-box { display: flex; align-items: center; gap: 14px; background: var(--blush); border-radius: 16px; padding: 18px 22px; }
        .wf-logo-box img { height: 56px; width: auto; border-radius: 8px; }
        .wf-logo-box .wf-wild { font-family: var(--font-s); font-size: 30px; color: var(--terra); }
        .wf-legal-header { background: linear-gradient(135deg, #FDE8DC, #F8C8A8); border-radius: 18px; padding: 26px; text-align: center; margin-bottom: 18px; }
        .wf-legal-script { font-family: var(--font-s); font-size: 16px; color: var(--brown); margin-bottom: 4px; }
        .wf-legal-title { font-family: var(--font-d); font-size: 28px; font-weight: 600; color: #fff; text-shadow: 0 2px 8px rgba(195,107,74,0.25); margin: 2px 0 8px; }
        .wf-legal-sub { font-size: 12.5px; color: rgba(255,255,255,0.9); }
        .wf-updated { display: inline-block; background: var(--blush-mid); color: var(--brown-mid); font-size: 11px; font-weight: 500; border-radius: 999px; padding: 5px 12px; margin-bottom: 16px; }
        .wf-toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .wf-toc span { font-size: 11px; color: var(--gray); background: var(--rose-lt); border-radius: 999px; padding: 4px 10px; }
        .wf-article { margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px dashed rgba(242,191,181,0.4); }
        .wf-article:last-child { border-bottom: none; }
        .wf-article-tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--peach-dk); background: var(--rose-lt); border-radius: 999px; padding: 3px 10px; margin-bottom: 8px; }
        .wf-article h3 { font-family: var(--font-d); font-size: 19px; font-weight: 600; color: var(--brown); margin: 0 0 8px; }
        .wf-article p { font-size: 13px; color: var(--brown-mid); line-height: 1.7; margin: 0 0 8px; }
        .wf-histoire-block { margin-bottom: 22px; }
        .wf-histoire-block-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--peach-dk); margin-bottom: 8px; }
        .wf-photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .wf-photo-cell { aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--blush); display: flex; align-items: center; justify-content: center; }
        .wf-photo-cell img { width: 100%; height: 100%; object-fit: cover; }
        .wf-photo-cell.empty { color: var(--gray); font-size: 11px; }
        .wf-photo-single { aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; background: var(--blush); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
        .wf-photo-single img { width: 100%; height: 100%; object-fit: cover; }
      `, { raw: true });

      const h = window.h;
      const createClass = window.createClass;

      function fmtPrice(p) {
        const n = typeof p === 'number' ? p : parseFloat(p || 0);
        return n.toFixed(2).replace('.', ',') + ' €';
      }

      /* ── APERÇU : Réglages du site (logo) ── */
      CMS.registerPreviewTemplate('site', createClass({
        render: function () {
          const { entry, getAsset } = this.props;
          const logoPath = entry.getIn(['data', 'logo_image']);
          const asset = logoPath ? getAsset(logoPath) : null;
          const brand = entry.getIn(['data', 'brand_name']) || 'Wild Flower by Wooden Mountain';
          const email = entry.getIn(['data', 'contact_email']) || '';
          return h('div', {},
            h('div', { className: 'wf-logo-box' },
              asset ? h('img', { src: asset.url, alt: brand }) : h('span', { className: 'wf-wild' }, 'Wild'),
              h('div', {},
                h('div', { style: { fontFamily: 'var(--font-b)', fontWeight: 600, color: 'var(--brown)' } }, brand),
                h('div', { style: { fontSize: '12px', color: 'var(--gray)' } }, email)
              )
            )
          );
        }
      }));

      /* ── APERÇU : Page d'accueil ── */
      CMS.registerPreviewTemplate('home', createClass({
        render: function () {
          const { entry, getAsset } = this.props;
          const g = (path) => entry.getIn(['data', ...path]) || '';
          const chips = entry.getIn(['data', 'histoire', 'chips']);
          const chipsArr = chips && chips.toJS ? chips.toJS() : (Array.isArray(chips) ? chips : []);
          const heroImg = (path) => {
            if (!path) return h('div', { style: { width: '100%', height: '100%', borderRadius: 'inherit', background: 'rgba(255,255,255,0.35)' } });
            const asset = getAsset(path);
            return h('img', { src: asset ? asset.url : '', style: { width: '100%', height: '100%', objectFit: 'cover', borderRadius: 'inherit' } });
          };

          return h('div', {},
            h('div', { className: 'wf-promo' }, g(['promo_bar'])),
            h('div', { className: 'wf-hero' },
              h('div', { className: 'wf-script' }, g(['hero', 'script'])),
              h('div', { className: 'wf-h1' }, g(['hero', 'title_line1']) + ' ' + g(['hero', 'title_line2'])),
              h('div', { className: 'wf-sub' }, g(['hero', 'subtitle'])),
              h('span', { className: 'wf-btn' }, g(['hero', 'button_text'])),
              h('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center', marginTop: '18px' } },
                h('div', { style: { width: '80px', height: '80px', borderRadius: '14px', overflow: 'hidden' } }, heroImg(entry.getIn(['data', 'hero', 'main_image']))),
                h('div', { style: { width: '40px', height: '40px', borderRadius: '10px', overflow: 'hidden' } }, heroImg(entry.getIn(['data', 'hero', 'small_image_1']))),
                h('div', { style: { width: '40px', height: '40px', borderRadius: '10px', overflow: 'hidden' } }, heroImg(entry.getIn(['data', 'hero', 'small_image_2']))),
                h('div', { style: { width: '40px', height: '40px', borderRadius: '10px', overflow: 'hidden' } }, heroImg(entry.getIn(['data', 'hero', 'small_image_3'])))
              )
            ),
            h('div', { className: 'wf-section-title' }, 'Section boutique'),
            h('div', { className: 'wf-section-h2' }, g(['boutique_title']) + ' — ' + g(['boutique_subtitle'])),
            h('div', { className: 'wf-block' },
              h('h3', {}, g(['histoire', 'title'])),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', maxWidth: '200px', marginBottom: '14px' } },
                ['about_img1', 'about_img2', 'about_img3', 'about_img4'].map((f, i) =>
                  h('div', { key: i, style: { width: '100%', aspectRatio: '1', borderRadius: '14px', overflow: 'hidden' } }, heroImg(entry.getIn(['data', 'histoire', f])))
                )
              ),
              h('p', {}, g(['histoire', 'paragraph1'])),
              h('p', {}, g(['histoire', 'paragraph2'])),
              h('div', {}, chipsArr.map((c, i) => h('span', { key: i, className: 'wf-chip' }, c)))
            ),
            h('div', { className: 'wf-block' },
              h('h3', {}, g(['contact', 'intro_title'])),
              h('p', {}, g(['contact', 'intro_text'])),
              h('p', { style: { fontSize: '12.5px' } }, '📧 ' + g(['contact', 'email'])),
              h('div', { className: 'wf-quote' }, '"' + g(['contact', 'quote']) + '"')
            ),
            h('div', { className: 'wf-footer' },
              h('p', {}, g(['footer_tagline'])),
              h('p', {}, g(['footer_copyright']))
            )
          );
        }
      }));

      /* ── APERÇU : Produits Boutique & Nouveautés (même logique) ── */
      function renderProductGrid(entry, getAsset, includeFeature) {
        const products = entry.getIn(['data', 'products']);
        const arr = products && products.toJS ? products.toJS() : (Array.isArray(products) ? products : []);
        const feature = includeFeature ? entry.getIn(['data', 'feature']) : null;
        const featureObj = feature && feature.toJS ? feature.toJS() : feature;

        const cards = arr.map((p, i) => {
          const asset = p.image ? getAsset(p.image) : null;
          return h('div', { key: i, className: 'wf-card' },
            h('div', { className: 'wf-card-img', style: { background: p.bg || '#F5EDE8' } },
              p.badge ? h('span', { className: 'wf-card-badge ' + p.badge }, p.badge === 'bestseller' ? '⭐ Bestseller' : p.badge === 'exclu' ? 'Exclu' : 'Nouveau') : null,
              asset ? h('img', { src: asset.url, style: { width: '100%', height: '100%', objectFit: 'cover' } }) : h('span', { style: { fontSize: '38px' } }, p.emoji || '')
            ),
            h('div', { className: 'wf-card-body' },
              h('div', { className: 'wf-card-cat' }, p.category || ''),
              h('div', { className: 'wf-card-name' }, p.name || ''),
              h('div', { className: 'wf-card-desc' }, p.description || ''),
              h('div', { className: 'wf-card-price' }, fmtPrice(p.price)),
              (p.colors && p.colors.length) ? h('div', { className: 'wf-colors' }, p.colors.map((c, ci) => h('span', { key: ci, className: 'wf-color-dot', style: { background: c } }))) : null
            )
          );
        });

        return h('div', {},
          featureObj ? h('div', { className: 'wf-feature' },
            h('div', { className: 'wf-feature-tag' }, featureObj.tag || ''),
            h('h2', {}, featureObj.name || ''),
            h('p', {}, featureObj.description || ''),
            h('div', { style: { marginTop: '10px', fontWeight: 700 } }, fmtPrice(featureObj.price))
          ) : null,
          h('div', { className: 'wf-grid' }, cards)
        );
      }

      CMS.registerPreviewTemplate('products', createClass({
        render: function () {
          const { entry, getAsset } = this.props;
          const g = (path) => entry.getIn(['data', ...path]) || '';
          return h('div', {},
            h('div', { className: 'wf-legal-header' },
              h('div', { className: 'wf-legal-script' }, g(['header_script'])),
              h('div', { className: 'wf-legal-title' }, g(['header_title'])),
              h('div', { className: 'wf-legal-sub' }, g(['header_subtitle']))
            ),
            h('div', { style: { fontSize: '11px', fontWeight: 600, letterSpacing: '.15em', textTransform: 'uppercase', color: '#D97A52', marginTop: '20px' } }, g(['section_label']) || 'Nos créations fraîches'),
            h('div', { style: { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: '26px', color: '#8B6355', marginBottom: '6px' } }, g(['section_title']) || "Ce qui vient d'arriver"),
            h('div', { style: { fontFamily: 'Playfair Display, serif', fontSize: '20px', fontWeight: 600, margin: '18px 0 10px', color: '#5C3A28' } }, g(['creoles_title']) || 'Choisis tes créoles'),
            h('div', { style: { fontFamily: 'Playfair Display, serif', fontSize: '20px', fontWeight: 600, margin: '18px 0 8px', color: '#5C3A28' } }, g(['pampilles_title']) || 'Choisis tes pampilles'),
            h('div', { style: { display: 'flex', gap: '8px', marginBottom: '16px' } },
              h('span', { style: { background: '#C1653F', color: '#fff', padding: '6px 14px', borderRadius: '999px', fontSize: '12px', fontWeight: 600 } }, g(['pampilles_tab_all']) || 'Tout voir'),
              h('span', { style: { background: '#F5EDE8', color: '#5C3A28', padding: '6px 14px', borderRadius: '999px', fontSize: '12px' } }, g(['pampilles_tab_uni']) || 'Pampilles unies'),
              h('span', { style: { background: '#F5EDE8', color: '#5C3A28', padding: '6px 14px', borderRadius: '999px', fontSize: '12px' } }, g(['pampilles_tab_motifs']) || 'Pampilles à motifs')
            ),
            renderProductGrid(entry, getAsset, false)
          );
        }
      }));

      CMS.registerPreviewTemplate('nouveautes', createClass({
        render: function () {
          const { entry, getAsset } = this.props;
          const g = (path) => entry.getIn(['data', ...path]) || '';
          const mosaicImg = (path) => {
            if (!path) return h('div', { style: { width: '100%', height: '100%', borderRadius: '14px', background: 'rgba(255,255,255,0.35)' } });
            const asset = getAsset(path);
            return h('img', { src: asset ? asset.url : '', style: { width: '100%', height: '100%', objectFit: 'cover', borderRadius: '14px' } });
          };
          return h('div', {},
            h('div', { className: 'wf-hero' },
              h('div', { className: 'wf-script' }, g(['hero_eyebrow'])),
              h('div', { className: 'wf-h1' }, g(['hero_title_line1']) + ' ' + g(['hero_title_line2'])),
              h('div', { className: 'wf-sub' }, g(['hero_subtitle'])),
              h('div', { style: { marginTop: '10px' } },
                [g(['hero_tag1']), g(['hero_tag2']), g(['hero_tag3'])].filter(Boolean).map((t, i) =>
                  h('span', { key: i, className: 'wf-chip', style: { marginRight: '6px' } }, t))
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', maxWidth: '220px', margin: '18px auto 0' } },
                ['mosaic_image_1', 'mosaic_image_2', 'mosaic_image_3', 'mosaic_image_4'].map((f, i) =>
                  h('div', { key: i, style: { width: '100%', aspectRatio: '1', overflow: 'hidden' } }, mosaicImg(entry.getIn(['data', f])))
                )
              )
            ),
            h('div', {
              style: {
                background: 'linear-gradient(135deg, #C1653F 0%, #8B5A3C 100%)',
                borderRadius: '18px', padding: '20px 24px', margin: '16px 0',
                color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px'
              }
            },
              h('div', {},
                h('div', { style: { fontWeight: 700, fontSize: '14px', marginBottom: '4px' } }, g(['countdown_title']) || '🌸 Compte à rebours'),
                h('div', { style: { fontSize: '12px', opacity: .85 } }, g(['countdown_subtitle']))
              ),
              (function () {
                const endRaw = entry.getIn(['data', 'countdown_end']);
                if (!endRaw) return h('div', { style: { fontSize: '11px', opacity: .7, fontStyle: 'italic' } }, 'Aucune date de fin définie');
                const end = new Date(endRaw);
                const diff = Math.max(0, end - new Date());
                const days = Math.floor(diff / 86400000);
                const hours = Math.floor((diff % 86400000) / 3600000);
                return h('div', { style: { display: 'flex', gap: '10px' } },
                  h('div', { style: { background: 'rgba(255,255,255,0.15)', borderRadius: '10px', padding: '8px 14px', textAlign: 'center', minWidth: '54px' } },
                    h('div', { style: { fontSize: '20px', fontWeight: 700 } }, days),
                    h('div', { style: { fontSize: '9px', opacity: .8, textTransform: 'uppercase' } }, 'Jours')
                  ),
                  h('div', { style: { background: 'rgba(255,255,255,0.15)', borderRadius: '10px', padding: '8px 14px', textAlign: 'center', minWidth: '54px' } },
                    h('div', { style: { fontSize: '20px', fontWeight: 700 } }, hours),
                    h('div', { style: { fontSize: '9px', opacity: .8, textTransform: 'uppercase' } }, 'Heures')
                  )
                );
              })()
            ),
            h('div', { className: 'wf-section-title' }, g(['section_label'])),
            h('div', { className: 'wf-section-h2' }, g(['section_title'])),
            renderProductGrid(entry, getAsset, false),
            h('div', { className: 'wf-section-title', style: { marginTop: '20px' } }, g(['sneak', 'script'])),
            h('div', { className: 'wf-section-h2' }, g(['sneak', 'title'])),
            h('div', { className: 'wf-grid' },
              (function () {
                const cards = entry.getIn(['data', 'sneak', 'cards']);
                const arr = cards && cards.toJS ? cards.toJS() : (Array.isArray(cards) ? cards : []);
                return arr.map((c, i) => h('div', { key: i, className: 'wf-card' },
                  h('div', { className: 'wf-card-img', style: { background: c.bg || '#F5EDE8' } },
                    h('div', { style: { width: '60%', height: '60%', borderRadius: '50%', background: c.accent || '#D4A0A0', opacity: .5, filter: 'blur(3px)' } })
                  ),
                  h('div', { className: 'wf-card-body' },
                    h('div', { className: 'wf-card-name' }, c.name || ''),
                    h('div', { className: 'wf-card-desc' }, c.date || '')
                  )
                ));
              })()
            )
          );
        }
      }));

      /* ── APERÇU : Pages légales (CGV, Mentions légales, Confidentialité, Livraisons) ── */
      function renderLegalPage(entry) {
        const g = (path) => entry.getIn(['data', ...path]) || '';
        const sections = entry.getIn(['data', 'sections']);
        const arr = sections && sections.toJS ? sections.toJS() : (Array.isArray(sections) ? sections : []);

        return h('div', {},
          h('div', { className: 'wf-legal-header' },
            h('div', { className: 'wf-legal-script' }, g(['header_script'])),
            h('div', { className: 'wf-legal-title' }, g(['header_title'])),
            h('div', { className: 'wf-legal-sub' }, g(['header_subtitle']))
          ),
          g(['updated_label']) ? h('span', { className: 'wf-updated' }, g(['updated_label'])) : null,
          h('div', { className: 'wf-toc' }, arr.map((s, i) =>
            h('span', { key: i }, (s.toc_emoji || '📄') + ' ' + (s.toc_label || s.title))
          )),
          h('div', {}, arr.map((s, i) =>
            h('div', { key: i, className: 'wf-article' },
              h('span', { className: 'wf-article-tag' }, s.tag || ''),
              h('h3', {}, s.title || ''),
              (s.body || '').split('\n\n').map((block, bi) =>
                h('p', { key: bi }, block.replace(/^\[ENCADRÉ\]\s*/, '⚡ ').replace(/^-\s?/gm, '• '))
              )
            )
          ))
        );
      }

      ['cgv', 'mentions-legales', 'confidentialite', 'livraisons'].forEach(function (name) {
        CMS.registerPreviewTemplate(name, createClass({
          render: function () {
            return renderLegalPage(this.props.entry);
          }
        }));
      });

      /* ── APERÇU : Textes de la page Notre histoire ── */
      CMS.registerPreviewTemplate('histoire-textes', createClass({
        render: function () {
          const { entry } = this.props;
          const g = (path) => entry.getIn(['data', ...path]) || '';
          const values = entry.getIn(['data', 'values']);
          const valuesArr = values && values.toJS ? values.toJS() : (Array.isArray(values) ? values : []);

          function block(key, label) {
            return h('div', { className: 'wf-block' },
              h('div', { className: 'wf-article-tag' }, g([key, 'label'])),
              h('h3', {}, g([key, 'title'])),
              h('p', { style: { fontStyle: 'italic', color: 'var(--peach-dk)' } }, g([key, 'eyebrow'])),
              h('p', {}, g([key, 'p1'])),
              h('p', {}, g([key, 'p2'])),
              h('p', {}, g([key, 'p3'])),
              h('div', { className: 'wf-chip', style: { display: 'inline-block' } }, (g([key, 'float_icon']) + ' ' + g([key, 'float_text'])).trim())
            );
          }

          return h('div', {},
            h('div', { className: 'wf-legal-header' },
              h('div', { className: 'wf-legal-script' }, g(['hero', 'eyebrow'])),
              h('div', { className: 'wf-legal-title' }, g(['hero', 'title_line1']) + ' ' + g(['hero', 'title_line2'])),
              h('div', { className: 'wf-legal-sub' }, g(['hero', 'lead']))
            ),
            h('div', { className: 'wf-quote' }, g(['hero', 'quote_text'])),
            h('p', { style: { fontSize: '12px', color: 'var(--gray)', marginBottom: '16px' } }, g(['hero', 'quote_author'])),
            h('div', { className: 'wf-grid', style: { marginBottom: '18px' } },
              [1, 2, 3].map(n => h('div', { key: n, style: { fontSize: '12px' } },
                g(['hero', 'stat' + n + '_num']) + ' — ' + g(['hero', 'stat' + n + '_label'])
              ))
            ),
            h('div', { className: 'wf-toc' }, valuesArr.map((v, i) =>
              h('span', { key: i }, (v.icon || '') + ' ' + (v.title || ''))
            )),
            block('block1'),
            block('block2'),
            block('block3'),
            h('div', { className: 'wf-block' },
              h('h3', {}, g(['materials', 'title'])),
              h('p', {}, g(['materials', 'p1'])),
              h('p', {}, g(['materials', 'p2'])),
              h('p', {}, g(['materials', 'p3']))
            )
          );
        }
      }));

      /* ── APERÇU : Photos de la page Notre Histoire ── */
      CMS.registerPreviewTemplate('histoire', createClass({
        render: function () {
          const { entry, getAsset } = this.props;
          const photoCell = (path) => {
            const asset = path ? getAsset(path) : null;
            return h('div', { className: 'wf-photo-cell' + (asset ? '' : ' empty') },
              asset ? h('img', { src: asset.url }) : h('span', {}, 'vide')
            );
          };
          const photoSingle = (path) => {
            const asset = path ? getAsset(path) : null;
            return h('div', { className: 'wf-photo-single' },
              asset ? h('img', { src: asset.url }) : h('span', { style: { color: 'var(--gray)', fontSize: '11px' } }, 'vide')
            );
          };
          const g = (path) => entry.getIn(['data', ...path]) || '';

          return h('div', {},
            h('div', { className: 'wf-histoire-block' },
              h('div', { className: 'wf-histoire-block-label' }, '🌸 Bloc 1 — Née d\'une passion'),
              h('div', { className: 'wf-photo-grid' },
                photoCell(g(['block1_image_1'])),
                photoCell(g(['block1_image_2'])),
                photoCell(g(['block1_image_3'])),
                photoCell(g(['block1_image_4']))
              )
            ),
            h('div', { className: 'wf-histoire-block' },
              h('div', { className: 'wf-histoire-block-label' }, '🏺 Bloc 2 — L\'argile polymère'),
              photoSingle(g(['block2_image']))
            ),
            h('div', { className: 'wf-histoire-block' },
              h('div', { className: 'wf-histoire-block-label' }, '🔄 Bloc 3 — Changer d\'humeur'),
              photoSingle(g(['block3_image']))
            ),
            h('div', { className: 'wf-histoire-block' },
              h('div', { className: 'wf-histoire-block-label' }, '✨ Section Matériaux'),
              h('div', { className: 'wf-photo-grid' },
                photoCell(g(['materials_image_1'])),
                photoCell(g(['materials_image_2'])),
                photoCell(g(['materials_image_3'])),
                photoCell(g(['materials_image_4']))
              )
            )
          );
        }
      }));

    /* ── APERÇU : Chronologie, engagements, témoignages, CTA ── */
    CMS.registerPreviewTemplate('histoire-suite', createClass({
      render: function () {
        const { entry } = this.props;
        const g = (path) => entry.getIn(['data', ...path]) || '';
        const toArr = (v) => v && v.toJS ? v.toJS() : (Array.isArray(v) ? v : []);
        const steps = toArr(entry.getIn(['data', 'timeline', 'steps']));
        const cards = toArr(entry.getIn(['data', 'engagement', 'cards']));
        const reviews = toArr(entry.getIn(['data', 'testimonials', 'reviews']));

        return h('div', {},
          h('div', { className: 'wf-section-title' }, g(['timeline', 'label'])),
          h('div', { className: 'wf-section-h2' }, g(['timeline', 'title'])),
          h('div', {}, steps.map((s, i) => h('div', { key: i, className: 'wf-article' },
            h('span', { className: 'wf-article-tag' }, (s.dot || '') + ' ' + (s.step || '')),
            h('h3', {}, s.title || ''),
            h('p', {}, s.desc || '')
          ))),
          h('div', { className: 'wf-section-title', style: { marginTop: '20px' } }, g(['engagement', 'label'])),
          h('div', { className: 'wf-section-h2' }, g(['engagement', 'title'])),
          h('div', { className: 'wf-grid' }, cards.map((c, i) => h('div', { key: i, className: 'wf-card' },
            h('div', { className: 'wf-card-body' },
              h('div', { style: { fontSize: '28px' } }, c.icon || ''),
              h('div', { className: 'wf-card-name' }, c.title || ''),
              h('div', { className: 'wf-card-desc' }, c.desc || '')
            )
          ))),
          h('div', { className: 'wf-section-title', style: { marginTop: '20px' } }, g(['testimonials', 'label'])),
          h('div', { className: 'wf-section-h2' }, g(['testimonials', 'title'])),
          h('div', {}, reviews.map((rv, i) => h('div', { key: i, className: 'wf-block' },
            h('p', { style: { fontStyle: 'italic' } }, '"' + (rv.text || '') + '"'),
            h('div', { style: { fontWeight: 600 } }, rv.author || ''),
            h('div', { style: { fontSize: '12px', color: 'var(--gray)' } }, rv.location || '')
          ))),
          h('div', { className: 'wf-feature', style: { marginTop: '20px', textAlign: 'center' } },
            h('div', { className: 'wf-feature-tag' }, g(['cta', 'script'])),
            h('h2', {}, g(['cta', 'title'])),
            h('p', {}, g(['cta', 'subtitle']))
          )
        );
      }
    }));

    });
  </script>
</body>
</html>
